recoverability:
  recoverable_from_publication:
  - Published plot images, captions, axes and displayed uncertainty bands
  - Selected digitizable spatial/spectral lineouts and electrical traces, with finite publication resolution
  - Published Table 4.1 estimates and geometry/diagnostic descriptions
  - MHD profile figures suitable for qualitative or digitized comparison after metadata checks
  not_recovered:
  - Original camera counts and dark/flat/stray-light frames
  - Per-shot gain, trigger, pixel calibration and full optical-response files
  - Original voltage/current scope waveforms and their timing/calibration uncertainties
  - Original Yacora input decks, level-population outputs and fit workflow
  - Original Allegra simulation decks, mesh/material tables and output fields
  - Complete shot log and resolution of conflicting captions
  constraints:
  - Digitized curves must be labeled reconstructed published data, not original raw data.
  - Published pseudocolor images are not invertible raw detector frames; color clipping, interpolation and plotting
    transformations may be irreversible.
  - Multiple shots at different gates do not form a single-shot time history without a repeatability model.
  - Line-of-sight integrated spectra alone do not uniquely identify transverse desorption structure.
  - Figures 4.28–4.30 are legacy simulation temperature profiles driven by shot 17133; the separately recovered
    current polyline is shot 15210. They do not constitute a same-shot thermal/current reconstruction.
  - Partial temperature recovery does not recover gap-facing surface values, time-dependent material boundaries
    or temperature time histories.
  - Current vector vertices behind the later legend are encoded source geometry and are flagged; plotting/filtering
    and physical measurement uncertainty remain unknown.
