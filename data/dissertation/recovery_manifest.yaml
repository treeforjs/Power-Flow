schema_version: 1
purpose: Published dissertation evidence and partial recovery of spectral profiles, legacy simulation temperatures
  and an encoded current polyline; no raw experimental data or original simulation arrays are supplied.
source:
  source_id: smith_dissertation_2025
  title: Characterizing Desorbed Surface Contaminants Leading to Plasma Formation in Power Feeds of Pulsed Power
    Accelerators
  author: Trevor Johannes Smith
  year: 2025
  item_url: https://deepblue.lib.umich.edu/items/9ccfa886-0b19-4bd8-b3b2-bb685b9ddefc
  handle_url: https://hdl.handle.net/2027.42/199376
