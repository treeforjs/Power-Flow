  bytes: 32298236
  pdf_pages: 203
  page_mapping:
    description: For Arabic printed pages in this PDF, PDF page number = printed page + 25. Both use one-based numbering.
    pdf_page_offset: 25
  retrieved_utc_date: '2026-10-18'
  raw_pdf_committed: false
status_definitions:
  published_only: Evidence exists only as a published figure, table or passage; original raw diagnostic data and
    metadata have not been recovered.
  not_digitized: No curve/image numerical extraction has been performed.
  partially_digitized: Only explicitly listed curves or vector paths have been recovered from the publication; all
    other quantities retain their stated pending status.
  table_transcribed: Numbers copied from the published table; these remain author-derived estimates, not independent
    measurements or raw data.
  digitized_published_simulation: Correlated samples digitized from a published legacy simulation raster; not original
    simulation arrays, experimental temperatures or FLASH output.
  vector_recovered: Encoded published vector geometry recovered from the PDF; not original acquisition samples or
    a measured waveform file.
