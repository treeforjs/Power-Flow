schema_version: 1
purpose: Published dissertation evidence and reconstruction targets, with separately labeled partial digitization;
  no raw experimental data are supplied.
source:
  source_id: smith_dissertation_2025
  title: Characterizing Desorbed Surface Contaminants Leading to Plasma Formation in Power Feeds of Pulsed Power
    Accelerators
  author: Trevor Johannes Smith
  year: 2025
  item_url: https://deepblue.lib.umich.edu/items/9ccfa886-0b19-4bd8-b3b2-bb685b9ddefc
  handle_url: https://hdl.handle.net/2027.42/199376
  pdf_url: https://backend.production.deepblue-documents.lib.umich.edu/server/api/core/bitstreams/24e682a8-896a-410d-85bb-ca4654a9db02/content
  alternate_pdf_url_unverified: https://plasmabay.engin.umich.edu/wp-content/uploads/sites/281/2025/04/2025-Trevor-Smith.pdf
  sha256: 1d7b1f9c191a37e94f1cc3634587750f1af35b07eb13e0b94c60f3da47495ed7
  bytes: 32298236
  pdf_pages: 203
  page_mapping:
    description: For Arabic printed pages in this PDF, PDF page number = printed page + 25. Both use one-based numbering.
    pdf_page_offset: 25
  retrieved_utc_date: '2026-10-18'
  raw_pdf_committed: false
status_definitions:
  published_only: Evidence exists only as a published figure, table or passage; original raw diagnostic data and
    metadata have not been recovered.
  not_digitized: No curve/image numerical extraction has been performed.
  partially_digitized: Some specified curves have been recovered from the published raster; other panels and original
    data remain unavailable.
  table_transcribed: Numbers copied from the published table; these remain author-derived estimates, not independent
    measurements or raw data.
geometry_and_instrument:
- id: mykonos_geometry
  value:
    gap_m: 0.005
    electrode_width_m: 0.005
    height_m: 0.025
  source: Fig. 4.2 and section 4.2
  printed_page: 54
  pdf_page: 79
  evidence_kind: reported_geometry
- id: foil_materials
  value:
    main_material: SS304
    also_tested: Al
  source: section 4.2
  printed_page: 54
  pdf_page: 79
  note: Narrative gives SS304 50–500 um but first-campaign captions explicitly include 25 um; do not infer each
    shot thickness from the narrative range.
- id: support
  value: Ultem 1010 FDM dielectric with high-strength epoxy attachment
  source: section 4.2
  printed_page: 55
  pdf_page: 80
- id: vuv_diagnostic
  value:
    measurement: gated emission
    spectrometer: McPherson 234/302
    focal_length_m: 0.2
    grating_grooves_per_mm: 1200
    grating_coating: Al+MgF2
    wavelength_range_nm:
    - 115
    - 165
    camera: Photek iCMOS 160 with S20 intensifier and MgF2 window
    gate_s: 3.0e-09
    reported_nm_per_pixel: 0.03
  source: section 4.3.2
  printed_pages:
  - 78
  - 79
  pdf_pages:
  - 103
  - 104
  note: The 0.03 nm/pixel value is sampling/dispersion, not a measured instrumental line-spread function. Each shot
    supplies one gated frame, not a spectral time series.
- id: vuv_spatial_projection
  value:
    resolved_axis: anode-cathode gap
    assumed_emitting_depth_m: 0.005
    integrated_axis: foil width
  source: Figs. 4.20–4.25 and section 4.4 Eq. 4.8
  printed_pages:
  - 84
  - 85
  - 86
  - 87
  - 88
  - 89
  - 92
  pdf_pages:
  - 109
  - 110
  - 111
  - 112
  - 113
  - 114
  - 117
  note: Transverse variation across foil width is not directly resolved by the published VUV images; the model must
    project emissivity along that width.
- id: vuv_calibration
  value: D2 lamp calibration, gain-response fit and etendue/optical throughput correction
  source: Figs. 4.18–4.19 and section 4.3.2
  printed_pages:
  - 80
  - 81
  - 82
  pdf_pages:
  - 105
  - 106
  - 107
  note: Gain measurements cover 20–55 with 3/5/10/100 ns gates and an exponential extrapolation outside that range.
    Calibration is described as approximate; full per-shot calibration and covariance are not available.
- id: breakdown_definition
  value: Resistive voltage collapse, Vres = Vbank - L dI/dt before geometry changes
  source: section 4.2 and Fig. 4.7
  printed_pages:
  - 59
  - 60
  - 61
  pdf_pages:
  - 84
  - 85
  - 86
  note: Visible onset is supporting evidence. Do not assign one universal breakdown time to all shots from the approximately
    50 ns conclusion.
species_evidence:
- species:
  - H
  - H2
  observable: H Lyman-alpha emission at approximately 121.6 nm and H2 Lyman/Werner molecular emission bands
  source: section 4.3.2, Figs. 4.20–4.25
  printed_pages:
  - 78
  - 83
  - 84
  - 85
  - 86
  - 87
  - 88
  - 89
  interpretation: Direct emission features; inferred total neutral densities depend on a CR model and source geometry.
- species:
  - H2O
  - H2
  - H
  - OH
  - O
  - CO/N2
  - O2
  - CO2
  observable: Background RGA mass spectrum
  source: Fig. 2.3 and section 2.4
  printed_page: 19
  pdf_page: 44
  interpretation: Background composition and ambiguous mass peaks do not uniquely determine the desorbed parent
    inventory for an individual discharge.
- species:
  - O II
  - Fe
  observable: Visible emission; O II near 464 nm early, Fe later
  source: section 4.3.1 and conclusions
  printed_pages:
  - 78
  - 100
  interpretation: Supports oxygen-bearing species and later metal participation; H2O parent density and OH kinetics
    are not directly measured by the VUV H/H2 features.
- species:
  - H2O
  observable: Proposed contaminant parent, including an approximately 1 eV surface binding-energy example
  source: section 2.4 Eqs. 2.30–2.31
  printed_page: 18
  pdf_page: 43
  interpretation: A water-breakdown network is a modeling hypothesis to constrain; water-only origin is not established.
    Section 2.4 p17 also discusses hydrogen trapped in SS304 bulk.
existing_model_evidence:
- id: yacora_fit_status
  source: section 4.3.2
  printed_page: 90
  pdf_page: 115
  finding: Fits are estimated by eye; example spectral-shape sensitivity is shown at 4000/5000/6000 K for shot 15802.
    No likelihood-based uncertainty analysis is supplied.
- id: yacora_level_resolution
  source: section 4.4
  printed_pages:
  - 91
  - 92
  pdf_pages:
  - 116
  - 117
  finding: Public Yacora outputs used by the author lack H l-sublevel populations and resolved H2 rotational populations;
    the text describes assigning a total population to each transition and limits comparison to general agreement.
    Do not reproduce this approximation as a complete CR model.
- id: alegra_edge_heating
  source: section 4.5 Figs. 4.27–4.30
  printed_pages:
  - 93
  - 94
  - 95
  - 96
  - 97
  - 98
  pdf_pages:
  - 118
  - 119
  - 120
  - 121
  - 122
  - 123
  finding: Existing 2D Allegra-labeled simulations already show stronger edge magnetic field/current density/heating.
    The model used a 200 um foil, a 5 mm gap and current from separate shot 17133, omitted dielectric supports,
    and shows profiles at 40 and 60 ns. Edge-heated width is described as hundreds of micrometres.
